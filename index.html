<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alice In Borderland Scenes</title>

    <!-- Manrope font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
        /* ---------- Reset & base ---------- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0a0a;
            --ink: #f2efe6;
            --muted: #b0aca0;
            --card-radius: 14px;
            --dur: 0.55s;
            --ease: cubic-bezier(0.65, 0, 0.35, 1);
            --ease-out: cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: 'Manrope', system-ui, sans-serif;
            font-weight: 400;
            overflow-x: hidden;
            min-height: 100vh;
            background: #0a0a0a;
            color: #fff;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ---------- Animated background — robust, pure-CSS ---------- */
        #bg-animation {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: #0a0a0a;
            overflow: hidden;
        }

        /* Amorphous blobs */
        #bg-animation .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            will-change: transform, opacity;
            animation: blobFloat 18s ease-in-out infinite alternate;
        }

        #bg-animation .blob:nth-child(1) {
            width: 55vw;
            height: 55vw;
            top: -10%;
            left: -10%;
            background: radial-gradient(circle, rgba(200, 80, 30, 0.6), transparent 70%);
            animation-duration: 22s;
            animation-delay: 0s;
        }
        #bg-animation .blob:nth-child(2) {
            width: 45vw;
            height: 45vw;
            bottom: -8%;
            right: -5%;
            background: radial-gradient(circle, rgba(40, 130, 210, 0.5), transparent 70%);
            animation-duration: 26s;
            animation-delay: -4s;
        }
        #bg-animation .blob:nth-child(3) {
            width: 40vw;
            height: 40vw;
            top: 40%;
            left: 60%;
            background: radial-gradient(circle, rgba(210, 60, 130, 0.4), transparent 70%);
            animation-duration: 20s;
            animation-delay: -9s;
        }
        #bg-animation .blob:nth-child(4) {
            width: 35vw;
            height: 35vw;
            bottom: 20%;
            left: 10%;
            background: radial-gradient(circle, rgba(220, 180, 40, 0.35), transparent 70%);
            animation-duration: 24s;
            animation-delay: -14s;
        }

        @keyframes blobFloat {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            33% {
                transform: translate(4%, -5%) scale(1.08) rotate(3deg);
            }
            66% {
                transform: translate(-3%, 6%) scale(0.92) rotate(-2deg);
            }
            100% {
                transform: translate(5%, 3%) scale(1.05) rotate(1deg);
            }
        }

        /* Noise overlay — works reliably */
        #bg-animation .noise {
            position: absolute;
            inset: 0;
            opacity: 0.10;
            mix-blend-mode: overlay;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='5' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
            background-size: 512px 512px;
            animation: noiseShift 0.7s steps(6) infinite;
        }

        @keyframes noiseShift {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: 128px 128px;
            }
        }

        /* ---------- Color tint overlay ---------- */
        #color-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background-color: transparent;
            transition: background-color 0.5s var(--ease);
        }

        /* ---------- Load-in animations ---------- */
        .load-fade {
            opacity: 0;
            transform: translateY(28px);
            animation: fadeUp 0.8s var(--ease-out) forwards;
        }

        .load-fade.delay-1 {
            animation-delay: 0.10s;
        }
        .load-fade.delay-2 {
            animation-delay: 0.20s;
        }
        .load-fade.delay-3 {
            animation-delay: 0.30s;
        }
        .load-fade.delay-4 {
            animation-delay: 0.40s;
        }
        .load-fade.delay-5 {
            animation-delay: 0.50s;
        }
        .load-fade.delay-6 {
            animation-delay: 0.60s;
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ---------- Header ---------- */
        .eyebrow {
            text-align: center;
            font-weight: 500;
            letter-spacing: 0.45em;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 40px;
            text-transform: uppercase;
            transition: opacity 0.35s var(--ease), transform 0.4s var(--ease);
        }

        h1 {
            text-align: center;
            font-weight: 800;
            font-size: clamp(30px, 5.5vw, 54px);
            letter-spacing: -0.02em;
            margin: 4px 0 36px;
            color: #fff;
            transition: opacity 0.35s var(--ease), transform 0.4s var(--ease);
        }
        h1 .highlight {
            background: linear-gradient(135deg, #f5c842, #e07a2a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .eyebrow.fade-out,
        h1.fade-out {
            opacity: 0;
            transform: translateY(-12px);
            pointer-events: none;
        }

        /* ---------- Bento Grid ---------- */
        .grid-wrap {
            position: relative;
            z-index: 2;
            max-width: 1120px;
            margin: 0 auto 60px;
            padding: 0 20px;
            transition: opacity 0.4s var(--ease);
        }

        .grid-wrap.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .bento {
            display: grid;
            grid-template-columns: 2fr 1fr;
            grid-template-rows: auto auto auto;
            gap: 18px;
        }

        /* Hero card — spans 2 cols, 3 rows */
        .bento .card-hero {
            grid-column: 1 / 2;
            grid-row: 1 / 4;
            aspect-ratio: auto;
        }

        /* Small cards — right column */
        .bento .card-sm {
            grid-column: 2 / 3;
            aspect-ratio: 16 / 10;
        }
        .bento .card-sm:nth-of-type(2) {
            grid-row: 2 / 3;
        }
        .bento .card-sm:nth-of-type(3) {
            grid-row: 3 / 4;
        }

        /* Responsive: stack on smaller screens */
        @media (max-width: 720px) {
            .bento {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
                gap: 16px;
            }
            .bento .card-hero {
                grid-column: 1 / 2;
                grid-row: auto;
                aspect-ratio: 16 / 9;
            }
            .bento .card-sm {
                grid-column: 1 / 2;
                grid-row: auto;
                aspect-ratio: 16 / 9;
            }
            .bento .card-sm:nth-of-type(2) {
                grid-row: auto;
            }
            .bento .card-sm:nth-of-type(3) {
                grid-row: auto;
            }
        }

        /* ---------- Cards ---------- */
        .card {
            position: relative;
            border-radius: var(--card-radius);
            overflow: hidden;
            cursor: pointer;
            background: #1a1a1a;
            transform: scale(1) translateZ(0);
            will-change: transform;
            transition: transform 0.25s var(--ease), box-shadow 0.3s var(--ease);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
            transform-style: preserve-3d;
            perspective: 800px;
        }

        .card .card-inner {
            width: 100%;
            height: 100%;
            transition: transform 0.15s var(--ease-out);
            transform-style: preserve-3d;
            will-change: transform;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s var(--ease);
            will-change: transform;
        }

        .card:hover img {
            transform: scale(1.04);
        }

        .card:active {
            transform: scale(0.97);
        }

        /* Suit badge */
        .suit {
            position: absolute;
            top: 12px;
            left: 14px;
            font-weight: 700;
            font-size: 22px;
            color: rgba(255, 255, 255, 0.85);
            opacity: 0;
            transition: opacity 0.3s var(--ease);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.7);
            z-index: 3;
            pointer-events: none;
        }

        .card:hover .suit {
            opacity: 1;
        }

        /* Card overlay glow on hover */
        .card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--card-radius);
            pointer-events: none;
            z-index: 2;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.3s var(--ease);
        }

        .card:hover::after {
            opacity: 1;
        }

        /* ---------- Ghost (FLIP target) ---------- */
        .ghost {
            position: fixed;
            z-index: 40;
            border-radius: var(--card-radius);
            overflow: hidden;
            box-shadow: 0 40px 120px rgba(0, 0, 0, 0.8);
            will-change: top, left, width, height;
        }

        .ghost img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ---------- Detail panel — brutalist, cinematic ---------- */
        .detail-panel {
            position: fixed;
            z-index: 40;
            left: 50%;
            transform: translateX(-50%);
            width: min(92%, 780px);
            padding: 0;
            border-radius: 0;
            background: rgba(8, 8, 8, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-left: 6px solid #e07a2a;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            opacity: 0;
            transform: translateX(-50%) translateY(18px);
            transition: opacity 0.5s var(--ease) 0.12s, transform 0.5s var(--ease) 0.12s;
            overflow: hidden;
            pointer-events: none;
        }

        .detail-panel.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        /* Diagonal cut corner (brutalist detail) */
        .detail-panel::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 48px 48px 0;
            border-color: transparent rgba(224, 122, 42, 0.25) transparent transparent;
            pointer-events: none;
        }

        /* Massive suit watermark */
        .detail-panel .watermark-suit {
            position: absolute;
            right: -10px;
            bottom: -30px;
            font-size: clamp(180px, 30vw, 320px);
            font-weight: 800;
            color: rgba(224, 122, 42, 0.07);
            pointer-events: none;
            line-height: 1;
            user-select: none;
            font-family: 'Manrope', system-ui, sans-serif;
            transform: rotate(-6deg);
        }

        .detail-panel .panel-content {
            position: relative;
            z-index: 2;
            padding: 32px 36px 36px 36px;
        }

        .detail-panel .panel-title {
            font-family: 'Manrope', system-ui, sans-serif;
            font-weight: 700;
            font-size: clamp(22px, 3.2vw, 34px);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #fff;
            margin: 0 0 8px 0;
            line-height: 1.2;
        }

        .detail-panel .panel-title .accent {
            color: #e07a2a;
        }

        /* Underline glow */
        .detail-panel .title-underline {
            width: 56px;
            height: 3px;
            background: linear-gradient(90deg, #e07a2a, #f5c842);
            margin: 10px 0 18px 0;
            border-radius: 2px;
            box-shadow: 0 0 20px rgba(224, 122, 42, 0.3);
        }

        .detail-panel .panel-quote {
            font-family: 'Manrope', system-ui, sans-serif;
            font-weight: 300;
            font-size: clamp(15px, 1.5vw, 18px);
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.85);
            margin: 0;
            padding-left: 8px;
            border-left: 2px solid rgba(224, 122, 42, 0.3);
            padding-left: 18px;
            letter-spacing: 0.01em;
        }

        .detail-panel .panel-quote .attribution {
            display: block;
            margin-top: 14px;
            font-weight: 400;
            font-size: 13px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
        }

        .detail-panel .panel-quote .attribution span {
            color: #e07a2a;
        }

        /* ---------- Close button ---------- */
        .close-btn {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 41;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            color: #fff;
            font-family: 'Manrope', system-ui, sans-serif;
            font-weight: 300;
            font-size: 22px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.35s var(--ease), transform 0.2s var(--ease), background 0.2s;
            pointer-events: none;
            will-change: transform, opacity;
        }

        .close-btn.show {
            opacity: 1;
            pointer-events: auto;
        }

        .close-btn:hover {
            background: rgba(224, 122, 42, 0.4);
            transform: scale(1.06);
            border-color: rgba(224, 122, 42, 0.4);
        }

        /* ---------- Responsive tweaks ---------- */
        @media (max-width: 640px) {
            .detail-panel {
                width: 94%;
                border-left-width: 4px;
            }
            .detail-panel .panel-content {
                padding: 22px 18px 26px 18px;
            }
            .detail-panel .panel-title {
                font-size: 20px;
                letter-spacing: 0.04em;
            }
            .detail-panel .panel-quote {
                font-size: 14px;
                line-height: 1.7;
                padding-left: 12px;
            }
            .detail-panel .watermark-suit {
                font-size: 120px;
                right: -6px;
                bottom: -18px;
            }
            .close-btn {
                top: 16px;
                right: 16px;
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
            .eyebrow {
                margin-top: 28px;
                font-size: 10px;
                letter-spacing: 0.3em;
            }
            h1 {
                margin: 2px 0 24px;
                font-size: 26px;
            }
            .grid-wrap {
                padding: 0 14px;
                margin-bottom: 40px;
            }
            .bento {
                gap: 12px;
            }
        }

        @media (max-width: 400px) {
            .detail-panel .panel-content {
                padding: 18px 14px 20px 14px;
            }
            .detail-panel .panel-title {
                font-size: 17px;
            }
            .detail-panel .panel-quote {
                font-size: 13px;
                padding-left: 10px;
            }
        }

        /* ---------- Utilities ---------- */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>
<body>

    <!-- Animated background -->
    <div id="bg-animation">
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="noise"></div>
    </div>

    <!-- Color tint overlay -->
    <div id="color-overlay"></div>

    <!-- Header -->
    <div class="eyebrow load-fade">NETFLIX &middot; SEASON COLLECTION</div>
    <h1 class="load-fade delay-1"><span class="highlight">Alice</span> In Borderland <span style="font-weight:300;letter-spacing:0.04em;background:linear-gradient(135deg,#f5c842,#e07a2a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">Scenes</span></h1>

    <!-- Grid -->
    <div class="grid-wrap load-fade delay-2" id="gridWrap">
        <div class="bento" id="grid"></div>
    </div>

    <!-- Close button -->
    <button class="close-btn" id="closeBtn" aria-label="Close detail view">✕</button>

    <script>
        /* ============================================================
               SCENE DATA — edit images, colors, titles, descriptions here
               ============================================================ */
        const SCENES = [{
            img: "images/image1.jpeg",
            color: "#C98006",
            suit: "♠",
            title: "King of Spades Blimp",
            subtitle: "S2E7",
            reason: "I absolutely LOVE this scene for its graphics as well as its impact on the storyline since they managed to kill the King of Spades in a very unexpected way. The blimp is also a very interesting concept and I love the way it was used in the story."
        }, {
            img: "images/image2.jpg",
            color: "#4E727A",
            suit: "♦",
            title: "Empty Tokyo",
            subtitle: "S1E1",
            reason: "I love the cinematography of this scene and just how tense it is in general. It is the start of MANY future plot twists in the series."
        }, {
            img: "images/image3.jpg",
            color: "#3B5425",
            suit: "♣",
            title: "Overgrown City",
            subtitle: "S2E1",
            reason: "Season 2 is by far my favorite season of the series because of the overgrown city of Tokyo. Peak VFX."
        }, {
            img: "images/image4.jpg",
            color: "#E59C3F",
            suit: "♥",
            title: "Sacred Fortunes",
            subtitle: "S3E1",
            reason: "This is the TRUE first game in the Alice In Borderland manga and I love it."
        }];

        /* ============================================================
               HELPERS
               ============================================================ */
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 0, g: 0, b: 0 };
        }

        /* ============================================================
               DOM REFS
               ============================================================ */
        const grid = document.getElementById("grid");
        const gridWrap = document.getElementById("gridWrap");
        const closeBtn = document.getElementById("closeBtn");
        const eyebrow = document.querySelector(".eyebrow");
        const heading = document.querySelector("h1");
        const colorOverlay = document.getElementById("color-overlay");

        let ghostEl = null;
        let panelEl = null;
        let isOpen = false;

        /* ============================================================
               BUILD BENTO GRID
               ============================================================ */
        SCENES.forEach((s, i) => {
            const card = document.createElement("div");
            const isHero = (i === 0);
            card.className = `card ${isHero ? 'card-hero' : 'card-sm'} load-fade delay-${Math.min(i + 3, 6)}`;

            // Inner wrapper for 3D tilt
            const inner = document.createElement("div");
            inner.className = "card-inner";
            inner.innerHTML =
                `<div class="suit">${s.suit || ''}</div><img src="${s.img}" alt="${s.title}" loading="lazy" draggable="false">`;
            card.appendChild(inner);

            // --- 3D tilt on hover ---
            card.addEventListener("mousemove", (e) => {
                if (isOpen) return;
                const rect = card.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width - 0.5;
                const y = (e.clientY - rect.top) / rect.height - 0.5;
                const rotX = y * -10;
                const rotY = x * 10;
                inner.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg) scale(1.02)`;
            });

            card.addEventListener("mouseleave", () => {
                if (isOpen) return;
                inner.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)';
            });

            // --- Color tint on hover ---
            card.addEventListener("mouseenter", () => {
                if (!isOpen) {
                    const rgb = hexToRgb(s.color);
                    colorOverlay.style.backgroundColor = `rgba(${rgb.r},${rgb.g},${rgb.b},0.40)`;
                }
            });

            card.addEventListener("mouseleave", () => {
                if (!isOpen) {
                    colorOverlay.style.backgroundColor = 'transparent';
                }
            });

            // --- Click to expand (FLIP) ---
            card.addEventListener("click", () => openDetail(card, s));

            grid.appendChild(card);
        });
        function openDetail(card, s) {
            if (isOpen) return;
            isOpen = true;

            const rgb = hexToRgb(s.color);
            colorOverlay.style.backgroundColor = `rgba(${rgb.r},${rgb.g},${rgb.b},0.55)`;

            // Fade header
            eyebrow.classList.add("fade-out");
            heading.classList.add("fade-out");

            const rect = card.getBoundingClientRect();
            const img = card.querySelector("img");

            // --- Ghost image (FLIP) ---
            ghostEl = document.createElement("div");
            ghostEl.className = "ghost";
            ghostEl.style.top = rect.top + "px";
            ghostEl.style.left = rect.left + "px";
            ghostEl.style.width = rect.width + "px";
            ghostEl.style.height = rect.height + "px";
            ghostEl.innerHTML = `<img src="${s.img}" alt="${s.title}" draggable="false">`;
            document.body.appendChild(ghostEl);

            gridWrap.classList.add("hidden");

            // Target size: large, centered near top
            const natW = img.naturalWidth || 1200;
            const natH = img.naturalHeight || 675;
            const maxW = Math.min(window.innerWidth * 0.90, 1100);
            const maxH = window.innerHeight * 0.62;
            let targetW = Math.min(natW, maxW);
            let targetH = targetW * (natH / natW);
            if (targetH > maxH) {
                targetH = maxH;
                targetW = targetH * (natW / natH);
            }
            targetW = Math.max(targetW, 340);
            targetH = Math.max(targetH, 200);

            const leftPos = (window.innerWidth - targetW) / 2;
            const topPos = 28;

            // Animate ghost to target
            requestAnimationFrame(() => {
                ghostEl.style.transition =
                    `top var(--dur) var(--ease), left var(--dur) var(--ease), width var(--dur) var(--ease), height var(--dur) var(--ease)`;
                ghostEl.style.top = topPos + "px";
                ghostEl.style.left = leftPos + "px";
                ghostEl.style.width = targetW + "px";
                ghostEl.style.height = targetH + "px";
            });

            // --- Detail panel ---
            panelEl = document.createElement("div");
            panelEl.className = "detail-panel";
            const panelTop = topPos + targetH + 24;
            panelEl.style.top = panelTop + "px";

            // Watermark suit
            const suitMark = s.suit || '♠';

            panelEl.innerHTML = `
                <div class="watermark-suit">${suitMark}</div>
                <div class="panel-content">
                    <div class="panel-title">${s.title} <span class="accent">${s.subtitle ? '· ' + s.subtitle : ''}</span></div>
                    <div class="title-underline"></div>
                    <div class="panel-quote">
                        ${s.reason}
                        <span class="attribution">— <span>Alice In Borderland</span> · Scene Gallery</span>
                    </div>
                </div>
            `;

            document.body.appendChild(panelEl);

            // Show panel + close btn with delay
            setTimeout(() => {
                panelEl.classList.add("show");
                closeBtn.classList.add("show");
            }, 580);
        }

        /* ============================================================
               CLOSE DETAIL
               ============================================================ */
        function closeDetail() {
            if (!isOpen || !ghostEl) return;

            closeBtn.classList.remove("show");
            if (panelEl) panelEl.classList.remove("show");
            colorOverlay.style.backgroundColor = 'transparent';

            // Find the matching card to snap back to
            const cards = grid.querySelectorAll(".card");
            const ghostImgSrc = ghostEl.querySelector("img").src;
            let targetCard = null;
            let targetRect = null;

            for (const c of cards) {
                const imgEl = c.querySelector("img");
                if (imgEl && imgEl.src === ghostImgSrc) {
                    targetCard = c;
                    targetRect = c.getBoundingClientRect();
                    break;
                }
            }

            if (targetRect) {
                ghostEl.style.transition =
                    `top var(--dur) var(--ease), left var(--dur) var(--ease), width var(--dur) var(--ease), height var(--dur) var(--ease)`;
                ghostEl.style.top = targetRect.top + "px";
                ghostEl.style.left = targetRect.left + "px";
                ghostEl.style.width = targetRect.width + "px";
                ghostEl.style.height = targetRect.height + "px";
            }

            gridWrap.classList.remove("hidden");
            eyebrow.classList.remove("fade-out");
            heading.classList.remove("fade-out");

            setTimeout(() => {
                if (ghostEl) {
                    ghostEl.remove();
                    ghostEl = null;
                }
                if (panelEl) {
                    panelEl.remove();
                    panelEl = null;
                }
                isOpen = false;
            }, 650);
        }

        closeBtn.addEventListener("click", closeDetail);

        /* ============================================================
               KEYBOARD: ESC to close
               ============================================================ */
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && isOpen) closeDetail();
        });

        /* ============================================================
               RESIZE: if open, reposition panel
               ============================================================ */
        let resizeTimer;
        window.addEventListener("resize", () => {
            if (!isOpen || !ghostEl || !panelEl) return;
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                closeDetail();
            }, 300);
        });

        /* prevent drag on images (mobile support kinda) */
        document.querySelectorAll('img').forEach(img => {
            img.setAttribute('draggable', 'false');
        });

        console.log('♠ Alice In Borderland — Scene Gallery loaded.');
    </script>

</body>
</html>
